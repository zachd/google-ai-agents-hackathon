version: "3.8"

services:
  # ADK Web Interface (optional - for debugging/testing)
  adk-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mystery-trip-adk-web
    ports:
      - "8081:8081"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    env_file:
      - .env
    command: ["sh", "-c", "adk web --port 8081 --host 0.0.0.0 ."]
    restart: unless-stopped
    profiles:
      - debug

  # FastAPI Backend (main API)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mystery-trip-backend
    ports:
      - "8080:8080"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - PORT=8080
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8080
    container_name: mystery-trip-frontend
    ports:
      - "8082:80"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:80",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  default:
    name: mystery-trip-network
